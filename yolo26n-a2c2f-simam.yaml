# YOLO26n + 主干 A2C2f（iter5 最佳）+ 检测头前 SimAM 无参注意力
# 思路：在 iter5（backbone P4/P5 用 A2C2f 区域注意力，mAP50 0.7409）基础上，
# 于送入 Detect 的三尺度输出（P3/P4/P5）各插一个 SimAM（Simple parameter-free
# Attention Module，ICML 2021），用能量函数计算 3D 注意力权重，零参数增量、
# 专为放大细小低对比度缺陷（crazing / rolled-in_scale）响应设计。
# SimAM 无参，完全契合轻量化目标；保留 YOLO26 核心特性 end2end + reg_max=1。
# 注意：SimAM 通道不变，走 parse_model else 分支 c2=ch[f]，YAML args 写 []。
nc: 6
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# backbone 与 iter5（yolo26n-a2c2f-backbone）完全一致：P4/P5 深层 C3k2→A2C2f
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, A2C2f, [512, True, 4]] # 6  ← P4 深层区域注意力
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, A2C2f, [1024, True, 1]] # 8  ← P5 深层区域注意力
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# head：在三尺度检测输出前各加 SimAM 无参注意力
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12  cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15  cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)
  - [-1, 1, SimAM, []] # 17  ← P3 SimAM 增强

  - [-1, 1, Conv, [256, 3, 2]] # 18 (from 17)
  - [[-1, 13], 1, Concat, [1]] # 19  cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)
  - [-1, 1, SimAM, []] # 21  ← P4 SimAM 增强

  - [-1, 1, Conv, [512, 3, 2]] # 22 (from 21)
  - [[-1, 10], 1, Concat, [1]] # 23  cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 (P5/32-large)
  - [-1, 1, SimAM, []] # 25  ← P5 SimAM 增强

  - [[17, 21, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
