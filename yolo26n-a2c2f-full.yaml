# YOLO26n + A2C2f 主干+颈部全注意力改进（合并 iter4 颈部 + iter5 主干）
# 思路：iter4（颈部A2C2f）与 iter5（主干A2C2f）各自都有效但单独不够。
#   - iter5 主干注意力：mAP50 +1.47pp / mAP50-95 +0.46pp（仅差临门一脚）
#   - iter4 颈部注意力：薄弱类 crazing +2.7pp
# 合并两者：backbone P4/P5 + neck 全部 C3k2→A2C2f，特征提取与多尺度融合双重增强。
# 严格保留 YOLO26 核心特性：end2end (NMS-free) + reg_max=1。
nc: 6
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, A2C2f, [512, True, 4]] # 6  ← P4 深层区域注意力（原 C3k2）
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, A2C2f, [1024, True, 1]] # 8  ← P5 深层区域注意力（原 C3k2）
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10  保留 YOLO26 原 PSA

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 13  ← 颈部区域注意力（原 C3k2）

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 16 (P3/8-small)  ← 颈部区域注意力

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 19 (P4/16-medium)  ← 颈部区域注意力

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)  保留（大目标头，注意力收益小）

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
